# Local "shift-left" secret scanning. Install once with:
#   pip install pre-commit   # or: brew install pre-commit / apt install pre-commit
#   pre-commit install
# Then every `git commit` runs Gitleaks over the staged changes and blocks the
# commit if a secret is found. See docs/security-scanning.md.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
